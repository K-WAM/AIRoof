name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # firebase-admin@14 requires Node >=22 (confirmed via `npm view firebase-admin@14.3.0 engines`).
  # Matches Vercel production's Node.js Version project setting (24.x) exactly, not just the floor,
  # so CI can't pass on a Node major prod doesn't actually run.
  NODE_VERSION: "24"

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - run: npm ci

      - run: npm run type-check

      - run: npm run lint

      - run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-dummy
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-dummy
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-dummy

      - run: npm test

      - name: Release acceptance suite
        run: npx vitest run --config tests/release/vitest.config.ts

      - name: Dependency vulnerability gate (critical only)
        # firebase-admin was bumped 12->14 (2026-09-03, T-062) specifically to close the 17
        # moderate/4 high findings this gate deliberately didn't block on when it was first added.
        # Kept at --audit-level=critical rather than tightened further — it exists to catch a
        # *future* regression, not to become a second copy of `npm audit`'s own full output.
        run: npm audit --omit=dev --audit-level=critical
